backend: "bionemo"
model_name_or_path: "${PROJECT_ROOT}/checkpoints/evo2_7b_nemo_flattened"
insert_every_n: 100
focus_tokens_per_block: 1
condense_ratio: 100
block_len: 100
freeze_base: true
max_position_embeddings: 131072
special_tokens:
  focus_token: "<|focus|>"
  focus_token_id: 126

train:
  epochs: 1
  steps: 20
  lr: 5.0e-4
  weight_decay: 0.01
  warmup_steps: 200
  batch_size: 1
  grad_accum: 8
  mixed_precision: bf16
  random_ratio_sampling: false
  ratio_range: [100, 100]
  seed: 42
  dataset:
    loader: fasta
    path: "${PROJECT_ROOT}/data/tiny.fasta"
    split: train
    text_field: text
    validation_fraction: 0.3

infer:
  max_new_tokens: 1024
  temperature: 0.8
  top_p: 0.95
  repetition_penalty: 1.0
  sliding_window: 512
  baseline_cache: "${PROJECT_ROOT}/output/baseline_metrics.json"

success_thresholds:
  memory_drop_min: 0.30
  quality_drop_max: 0.05
  speedup_min: 0.00

metrics:
  eval_tasks:
    - name: perplexity
      loader: fasta
      path: "${PROJECT_ROOT}/data/tiny.fasta"
      split: validation
      text_field: text
      max_samples: 16
  baseline_model_name_or_path: "${PROJECT_ROOT}/checkpoints/evo2_7b_nemo_flattened"
  baseline_backend: "bionemo"
  results_path: "${PROJECT_ROOT}/output/results.json"

paths:
  data_dir: "${PROJECT_ROOT}/data"
  output_dir: "${PROJECT_ROOT}/output"
  checkpoint_dir: "${PROJECT_ROOT}/checkpoints"
  log_dir: "${PROJECT_ROOT}/output/logs"

bionemo:
  model_size: "7b"
  seq_length: 512
  fp8: false
  use_te: true
  tokenizer: "byte-level"
  checkpoint_dir: "${PROJECT_ROOT}/checkpoints/evo2_7b_nemo"

logging:
  log_every: 10
  eval_every: 1000
  checkpoint_every: 500
